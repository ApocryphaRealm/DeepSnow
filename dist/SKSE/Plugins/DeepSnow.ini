; Deep Snow - settings
;
; Every setting here is also on the Deep Snow page of the Apocrypha Menu Framework (or SKSE Menu Framework), where
; changes apply at once and Save writes them back to this file.
;
; HOW DEEP IS THE SNOW? Deep Snow keeps its OWN model of the snow where someone stands - no mod can read the real snow
; that Dynamic Terrain Deformation draws. 100 = a full, untouched blanket (DTD's SnowRaiseHeight in game units, when DTD
; is installed). The model is:
;     depth % = 100 x the surface's depth below x the snow cover under the feet x the trail factor x the snowfall factor
; and 0 under a roof. The depth-band sliders in [Bands] are measured against exactly that number.

[General]
; 1 = deep snow slows you down and costs a little stamina. 0 = every Deep Snow effect is removed.
bEnabled=1

; 1 = other people and creatures are slowed too. 0 = only you. Their footsteps pack trails either way.
bAffectNPCs=0

; Milliseconds between checks of the ground. 250 = four times a second. 50 to 2000.
uTickMs=250

; How many nearby people and creatures are checked per tick (taking turns). 0 to 64.
uActorsPerTick=6

; People and creatures farther than this from you (game units) are ignored. 512 to 20000.
fScanRadius=6000.0

; 1 = make a speed change take hold at once (a tiny carry-weight nudge, net zero). 0 = leave it to the game.
bRefreshSpeed=1

[Depth]
; How deep each kind of ground counts, as a share of a full blanket (0 to 1).
; SNOW: snow textures. TRAIL: snowy path textures (already a trench). OBJECT: standing on a rock, bridge or dock.
; OTHER: ground no list in [Surfaces] names (dirt, grass, stone) - set 1.0 if your load order covers all ground in snow.
; Roads and ice have no row: roads are never slowed and never cost stamina, and ice is left to Ice is Slick.
fSnow=1.0
fTrail=0.35
fObject=0.0
fOther=0.0

; A roof or overhang within this many units above you means no snow underfoot. 0 turns the check off.
fShelterHeight=1024.0

; A full blanket, in game units, shown beside the % when DTD's INI is not found (DTD's own default is 35).
fFullDepthUnits=35.0

; 1 = read DTD's SnowRaiseHeight for the units shown. 0 = always use fFullDepthUnits.
bUseDTDHeight=1

; Where the snow depth comes from. 0 = Auto: Snow Deformation (a Community Shaders feature) when it is installed and on,
; otherwise Deep Snow's own model above. 1 = always Deep Snow's own model. 2 = Snow Deformation (Deep Snow's own model
; while it is off or missing). Snow Deformation reports the real snow under your feet, already deepened by its
; accumulation, so Deep Snow's own [Snowfall] deepening does not apply on top of it; roads, ice, roofs and the trail
; packing below still work as always.
uSource=0

; With Snow Deformation: the depth in game units that counts as a full blanket (100 %), 5 to 100. Its deepest snow is
; about 30 units at rest and 45 at the height of a snowfall, which then reads 150 %.
fSDFullDepthUnits=30.0

[Bands]
; Five depth bands. Each starts at a depth (% of a full blanket, 0 to 150), sets the movement speed there (% of normal,
; 10 to 100) and a stamina cost per second while moving (0 to 20). The deepest band reached applies.
fBand1Depth=10.0
fBand1Speed=95.0
fBand1Drain=0.5
fBand2Depth=30.0
fBand2Speed=88.0
fBand2Drain=1.0
fBand3Depth=50.0
fBand3Speed=80.0
fBand3Drain=1.5
fBand4Depth=70.0
fBand4Speed=72.0
fBand4Drain=2.0
fBand5Depth=90.0
fBand5Speed=65.0
fBand5Drain=2.5

[Stamina]
; 1 = the bands' stamina cost applies. 0 = speed only.
bDrain=1

; Deep snow never takes stamina below this % of its maximum. 0 to 100.
fFloor=10.0

[Roads]
; Roads are never slowed and never cost stamina, whatever the snow. A road is the navmesh flag below, a texture in
; sRoad, or ground marked with the page's "This is a road" button.
; 1 = faster travel on roads too (optional). 0 = roads are simply normal speed.
bBonus=0

; Speed on a road with the bonus on, % of normal. 100 to 150.
fSpeed=110.0

; 1 = the navmesh "preferred path" flag marks a road under you (as well as the road textures). Checked for you only.
bUseNavmesh=1

[Trails]
; 1 = anyone walking through snow packs it down.
bEnabled=1

; How much one pass packs the snow (0 to 1). 0.2 = five passes pack it fully.
fPackPerPass=0.2

; How deep a fully packed trail still is, as a share of the snow that was there (0 to 1).
fPackedRemain=0.25

; Game hours for fully packed snow to fill back in. 0.1 to 720.
fLifeHours=24.0

; Filling in runs this many times faster while it snows. 1 to 20.
fSnowRefill=3.0

; The most trail squares remembered (the least packed are dropped first). They are kept in the save.
uMaxCells=20000

; One trail square's side, game units. 32 to 1024.
fCellSize=128.0

[Snowfall]
; 1 = snowing weather deepens the snow, and it settles back after. 0 = off.
bDeepens=0

; % deeper per game hour of snowfall (and back down per hour without). 0 to 100.
fPerHour=10.0

; At most this % deeper. 0 to 200.
fMax=50.0

[Surfaces]
; Which landscape textures are which ground: the texture file's name without folder or .dds, comma-separated, '*'
; matches anything. ICE is left to Ice is Slick: no slowdown and no stamina cost there. A texture belongs to one list.
; The page's "This is snow / trail / road / ice" buttons add the texture under you here and save.
sSnow=snow01,snow02,snowrocks01
sTrail=dirtsnowpath01,*_trail*
; Roads: vanilla road01 textures and Northern Roads' dirt road (grounddirt01, its winter and edge variants).
sRoad=road01*,grounddirt01,grounddirt01_winter,grounddirt01_trail*
; ICE - the same ground Ice is Slick treats as ice, taken from Ice is Slick 1.0.3.2. Checked first, in this order:
; the collision material under you (decimal IDs: 873356572 = Ice, 2431524493 = IceForm), the frozen-water meshes
; (any part of the mesh's path), then the ice textures. Add here what you add to Ice is Slick's AdditionalMaterialIDs.
sIceMaterials=873356572,2431524493
sIceMeshes=landscape/ice/icefloes01.nif,landscape/ice/icefloessolid01.nif,landscape/ice/icefloessolid02.nif,landscape/ice/frozenpooll01.nif,landscape/ice/frozenmarshicefloel01.nif,landscape/ice/frozenmarshicefloem01.nif,landscape/ice/frozenmarshicefloes01.nif,landscape/ice/frozenmarshicefloes02.nif,landscape/ice/icebergsmall01_anim.nif,landscape/ice/icebergsmall02_anim.nif,landscape/ice/iceberglarge_anim.nif,landscape/ice/icefloessolid01_anim.nif,landscape/ice/icefloes01_anim.nif,landscape/ice/icefloessolid02_anim.nif,landscape/ice/frozenmarshicefloechunks01_anim.nif,landscape/ice/frozenmarshicefloechunks02_anim.nif,landscape/ice/frozenmarshicefloechunks03_anim.nif,dlc01/landscape/dlc01frozenlake01.nif,dlc01/landscape/dlc01frozenlakebreak01.nif,dlc01/landscape/dlc01frozenlakebreak02.nif,dlc01/landscape/dlc01frozenlakebreakcap.nif,dlc01/landscape/dlc01frozenlakebreakcap02.nif,dlc01/landscape/dlc01frozenlakeedgene.nif,dlc01/landscape/dlc1icefloel01.nif,dlc01/landscape/dlc1icefloem01.nif,dlc01/landscape/dlc1icefloes01.nif,dlc01/landscape/dlc1icefloes02.nif,dlc01/landscape/dlc1icefloechunks01.nif,dlc01/landscape/dlc1icefloechunks02.nif,dlc01/landscape/dlc1icefloechunks03.nif,dlc01/landscape/dlc1icelandbroken01.nif,dlc01/landscape/dlc1icelandbroken02.nif,dlc01/landscape/dlc1icefloechunks01_anim.nif,dlc01/landscape/dlc1icefloechunks02_anim.nif,dlc01/landscape/dlc1icefloechunks03_anim.nif
sIce=frozenmarshice01,frozenmarshice02,glacierslab,glaciersubsurface,glacierparallax,icefloes,athglaciersubsurface,icefloesunderparallax,icefloesunderparallax_l,icefloes_new4,icefloes_new4_l,icelakelower,icelakesurface,icewall01,icesurface,icefrozen03

[Probe]
; The milestone-1 ground probe: one log line per sample of what is under you. For troubleshooting only.
bEnabled=0
bLogSamples=1
uIntervalMs=500
; The roof ray starts this many units above the feet; the probe's roof ray looks this far up (Deep Snow itself uses
; fShelterHeight). The ground ray looks this far down. The navmesh triangle must be within fNavmeshMaxDz in height.
fRoofRayStart=100.0
fRoofRayLength=2048.0
fGroundRayLength=256.0
fNavmeshMaxDz=160.0

[Debug]
; 0 trace (everything), 1 debug, 2 info (the default), 3 warning, 4 error, 5 critical, 6 off.
uLogLevel=2
