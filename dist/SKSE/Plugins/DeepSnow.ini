; Deep Snow - settings (spike build)
;
; This build is the spike: a read-only ground probe. It changes nothing in the game. Twice a second it writes one line
; to Documents\My Games\Skyrim Special Edition\SKSE\DeepSnow.log saying what the player stands on (landscape texture,
; the navmesh triangle's preferred-path flag), whether a roof or overhang is overhead, and where the player is.

[Probe]
; 1 = sample the ground under the player. 0 = do nothing.
bEnabled=1

; 1 = write one log line per sample. 0 = keep the samples for the DevBench tool only.
bLogSamples=1

; Milliseconds between samples. 500 = twice a second. 100 to 10000.
uIntervalMs=500

; The roof ray starts this many game units above the player's feet and looks this far straight up.
fRoofRayStart=100.0
fRoofRayLength=2048.0

; The ground ray starts 32 units above the feet and looks this far straight down.
fGroundRayLength=256.0

; The largest height gap, in game units, between the player and a navmesh triangle that still counts as "under" them.
fNavmeshMaxDz=160.0

[Debug]
; 0 trace (everything), 1 debug, 2 info (the default), 3 warning, 4 error, 5 critical, 6 off.
; The probe's sample lines are written at info.
uLogLevel=2
